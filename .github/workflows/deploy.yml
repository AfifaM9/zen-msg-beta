name: Deploy

# Publishes the prebuilt APK(s) in fdroid/repo as a GitHub release and
# deploys them to GitHub Pages as a basic F-Droid-style repository.

on:
  push:
    branches: [master]
    paths:
      - "fdroid/repo/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List APKs
        id: apks
        run: |
          shopt -s nullglob
          apks=(fdroid/repo/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found in fdroid/repo, nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf 'Found: %s\n' "${apks[@]}"

      - name: Upload APK artifact
        if: steps.apks.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zen-msg-apks
          path: fdroid/repo/*.apk

      - name: Create GitHub release
        if: steps.apks.outputs.found == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fdroid/repo/*.apk
          generate_release_notes: true

      - name: Deploy fdroid/repo to GitHub Pages
        if: steps.apks.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          destination_dir: repo
